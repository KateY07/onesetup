<!doctype html>

  <title>OneSetup</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #202124; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
    h1 { margin-bottom: 8px; font-size: 42px; }
    h2 { margin-top: 36px; }
    p { line-height: 1.7; }
    a { color: #0969da; }
    pre { overflow-x: auto; padding: 16px; border-radius: 8px; background: #1f2328; color: #f0f6fc; }

<body>
  <main>
    <h1>OneSetup</h1>
    <p>把一个目录打包成单文件安装器。运行生成的 <code>.exe</code> 时，它会自动解压到临时目录，并执行根目录中的 <code>install.bat</code>（如果存在）。</p>

    <a class="download" href="https://github.com/KateY07/onesetup/releases/latest/download/onesetup.exe">下载 onesetup.exe</a>

    <h2>使用</h2>
    <pre><code>.onesetup.exe &lt;目录路径&gt; [-o &lt;输出文件&gt;]</code></pre>
    <p>不指定 <code>-o</code> 时，输出文件默认为 <code>&lt;目录名&gt;_setup.exe</code>。</p>

  </main>
</body>
